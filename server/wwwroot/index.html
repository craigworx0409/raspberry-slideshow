<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Slideshow</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.5rem; text-align: center; }
  .card { border: 1px solid #8884; border-radius: 12px; padding: 1.2rem; margin: 1rem 0; }
  .row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin-top: .6rem; }
  .name { font-weight: 600; font-size: 1.1rem; }
  .badge { font-size: .75rem; padding: .15rem .5rem; border-radius: 99px; color: #fff; }
  .online { background: #1a9e4b; }
  .offline { background: #c33; }
  .url { font-size: .85rem; word-break: break-all; opacity: .8; margin: .4rem 0 .8rem; }
  .pending { color: #d90; font-size: .85rem; }
  input, select { padding: .55rem; border-radius: 8px; border: 1px solid #8886; font-size: 1rem; }
  input { flex: 1; min-width: 180px; }
  button { padding: .55rem 1rem; border-radius: 8px; border: 1px solid #8886; background: #8881; cursor: pointer; font-size: .95rem; }
  button:hover { background: #8883; }
  button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
  .gallery-btn { display: block; width: 100%; text-align: left; margin-top: .5rem; padding: .7rem .9rem; }
  .gallery-btn.current { border-color: #1a9e4b; background: #1a9e4b22; }
  .msg { text-align: center; opacity: .75; margin: .8rem 0; min-height: 1.2em; }
  .foot { text-align: center; margin-top: 2rem; font-size: .85rem; opacity: .7; }
  .foot a { cursor: pointer; text-decoration: underline; }
  #pw-form.hidden, .hidden { display: none; }
  label { font-size: .85rem; opacity: .8; display: block; margin-top: .6rem; }
</style>
</head>
<body>
<h1>📺 My Slideshow</h1>

<div id="login-view" class="hidden">
  <div class="card">
    <p>Sign in to choose what your slideshow frame displays.</p>
    <div class="row"><input type="email" id="login-email" placeholder="Email" autocomplete="username"></div>
    <div class="row"><input type="password" id="login-pw" placeholder="Password" autocomplete="current-password"
         onkeydown="if(event.key==='Enter')login()"></div>
    <div class="row"><button class="primary" style="width:100%" onclick="login()">Sign in</button></div>
  </div>
  <p class="msg" id="login-msg"></p>
</div>

<div id="main-view" class="hidden">
  <div id="my-devices"></div>
  <p class="msg" id="main-msg"></p>
  <div class="foot">
    <span id="who"></span> · <a onclick="togglePwForm()">change password</a> · <a onclick="logout()">sign out</a>
    <div id="pw-form" class="hidden card" style="text-align:left">
      <label>Current password</label>
      <div class="row"><input type="password" id="pw-current" autocomplete="current-password"></div>
      <label>New password (8+ characters)</label>
      <div class="row"><input type="password" id="pw-new" autocomplete="new-password"></div>
      <div class="row"><button class="primary" onclick="changePassword()">Update password</button></div>
    </div>
  </div>
</div>

<script>
let me = null;
const galState = {};   // deviceId -> JSON snapshot of last-rendered gallery fragment

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function show(id) {
  document.getElementById('login-view').classList.toggle('hidden', id !== 'login');
  document.getElementById('main-view').classList.toggle('hidden', id !== 'main');
}

// Only touch the DOM when content changed — polling must never disturb
// focus or half-typed input values.
function setText(id, text) {
  const el = document.getElementById(id);
  if (el && el.textContent !== text) el.textContent = text;
}

async function post(path, body) {
  return fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
}

async function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pw').value;
  const r = await post('/api/login', { email, password });
  document.getElementById('login-msg').textContent =
    r.ok ? '' : (r.status === 401 ? 'Wrong email or password.' : 'Sign-in failed — try again.');
  if (r.ok) refresh();
}

async function logout() {
  await post('/api/logout', {});
  me = null;
  document.getElementById('my-devices').innerHTML = '';
  for (const k in galState) delete galState[k];
  show('login');
}

function togglePwForm() {
  document.getElementById('pw-form').classList.toggle('hidden');
}

async function changePassword() {
  const current = document.getElementById('pw-current').value;
  const nw = document.getElementById('pw-new').value;
  const r = await post('/api/me/password', { current, new: nw });
  const $m = document.getElementById('main-msg');
  if (r.ok) {
    $m.textContent = 'Password updated.';
    document.getElementById('pw-form').classList.add('hidden');
    document.getElementById('pw-current').value = document.getElementById('pw-new').value = '';
  } else {
    $m.textContent = r.status === 401 ? 'Current password is wrong.'
      : (await r.json().catch(() => ({}))).error ?? 'Could not update password.';
  }
}

async function setUrl(deviceId, url) {
  const r = await post(`/api/me/devices/${deviceId}/url`, { url });
  const $m = document.getElementById('main-msg');
  $m.textContent = r.ok ? 'Saved — your frame will switch within a minute.'
    : (await r.json().catch(() => ({}))).error ?? 'Could not save.';
  if (r.ok) refresh();
}

function setCustom(deviceId) {
  const input = document.getElementById('custom-' + deviceId);
  const url = input.value.trim();
  if (url) { input.value = ''; setUrl(deviceId, url); }
}

// Created once per device; the custom-URL input lives here and is never
// re-rendered afterward.
function createCard(d) {
  const div = document.createElement('div');
  div.className = 'card';
  div.id = 'card-' + d.id;
  div.innerHTML = `
    <div class="row" style="margin-top:0">
      <span class="name" id="name-${d.id}"></span>
      <span class="badge" id="badge-${d.id}"></span>
    </div>
    <div class="url" id="nowshowing-${d.id}"></div>
    <div class="pending hidden" id="pending-${d.id}">Change saved — switching within a minute…</div>
    <div id="gal-${d.id}"></div>
    <label>Or show any web page:</label>
    <div class="row">
      <input type="url" id="custom-${d.id}" placeholder="https://…"
             onkeydown="if(event.key==='Enter')setCustom('${d.id}')">
      <button onclick="setCustom('${d.id}')">Show it</button>
    </div>`;
  document.getElementById('my-devices').appendChild(div);
}

// Choices come from the image collections: each becomes a slideshow URL on
// this same site (plus an "everything" option with no group filter).
function slideshowOptions(collections) {
  const base = location.origin + '/slideshow/';
  const opts = [{ label: '✨ All photos', url: base }];
  for (const c of collections)
    opts.push({ label: `${c.name} (${c.imageCount})`,
                url: base + '?group=' + encodeURIComponent(c.name) });
  return opts;
}

function updateCard(d, collections) {
  const online = d.lastSeen && (Date.now() - new Date(d.lastSeen)) < 120000;
  const active = d.desiredUrl ?? d.currentUrl;
  const pendingNav = d.desiredUrl && d.desiredUrl !== d.currentUrl;
  const options = slideshowOptions(collections);
  const activeOption = options.find(o => o.url === active);

  setText('name-' + d.id, d.name ?? 'My frame');
  const badge = document.getElementById('badge-' + d.id);
  const badgeClass = 'badge ' + (online ? 'online' : 'offline');
  if (badge.className !== badgeClass) badge.className = badgeClass;
  setText('badge-' + d.id, online ? 'online' : 'offline');

  setText('nowshowing-' + d.id,
    'Now showing: ' + (activeOption ? activeOption.label : (active ?? '—')));
  document.getElementById('pending-' + d.id).classList.toggle('hidden', !pendingNav);

  // Buttons hold no inputs; rebuild only when their content would actually
  // differ (collections changed or the active selection moved).
  const fragment = options.map(o => `
    <button class="gallery-btn ${o.url === active ? 'current' : ''}"
            onclick="setUrl('${d.id}', ${JSON.stringify(o.url).replace(/"/g, '&quot;')})">
      ${o.url === active ? '✓ ' : ''}${esc(o.label)}
    </button>`).join('');
  if (galState[d.id] !== fragment) {
    galState[d.id] = fragment;
    document.getElementById('gal-' + d.id).innerHTML = fragment;
  }
}

async function refresh() {
  const r = await fetch('/api/me');
  if (!r.ok) { show('login'); return; }
  me = await r.json();
  show('main');
  setText('who', me.email);

  const $mine = document.getElementById('my-devices');
  const present = new Set(me.devices.map(d => d.id));
  for (const card of [...$mine.children])
    if (card.id.startsWith('card-') && !present.has(card.id.replace('card-', ''))) card.remove();

  if (!me.devices.length) {
    if (!document.getElementById('no-devices')) {
      $mine.innerHTML = '<div class="card" id="no-devices">No slideshow frame is linked to your account yet.</div>';
    }
    return;
  }
  const none = document.getElementById('no-devices');
  if (none) none.remove();

  for (const d of me.devices) {
    if (!document.getElementById('card-' + d.id)) createCard(d);
    updateCard(d, me.collections);
  }
}

refresh();
setInterval(() => { if (me) refresh(); }, 15000);
</script>
</body>
</html>
