# Kiosk device configuration — baked into the image, read-only in production.
# KEY=VALUE, no quotes. Read by kiosk.sh and kiosk-agent.py.

# Central hub base URL (no trailing slash)
HUB_URL=https://slideshow.YOUR-DOMAIN.com

# Shared secret; must match DeviceKey in the hub's appsettings.json
DEVICE_KEY=change-me-device-key

# Friendly name shown on the control page
DEVICE_NAME=living-room-tv

# Shown if the hub has never been reached (first boot, hub down)
DEFAULT_URL=https://your-slideshow-url.com

# Heartbeat/poll interval in seconds
POLL_SECS=45

# Restart the browser every N hours to shed accumulated memory (0 = off).
# The restart shows the splash for a few seconds — timed off-peak-ish.
RELOAD_EVERY_HOURS=6
